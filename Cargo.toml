[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/filter-engine",
    "crates/ext-rules",
    "crates/list-service",
    "crates/userscript-engine",
    "crates/script-policy",
    "crates/web-api",
    "crates/web-ui",
    "crates/common",
    "crates/api-types",
    "crates/e2e",
    "crates/e2e-browser",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
# Real floor: oxc_parser 0.126 (filter-engine) requires Rust 1.92. Toolchain is pinned to
# stable in rust-toolchain.toml; no nightly features are used.
rust-version = "1.92"
authors = ["Argus Contributors"]
publish = false
repository = "https://github.com/metril/argus"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures-util = "0.3"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli", "zlib", "deflate"] }

# HTTP
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
h2 = "0.4"

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls-pemfile = "2.2"
pem = "3.0"

# WebSocket
tokio-tungstenite = "0.24"

# Web framework (API)
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }

# Authentication & Security
bcrypt = "0.16"
jsonwebtoken = "9.3"
argon2 = "0.5"
age = "0.11"
secrecy = "0.10"
zeroize = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# Configuration
config = { version = "0.14", default-features = false, features = ["toml"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
url = "2.5"
regex = "1.11"
bytes = "1.9"
http-body-util = "0.1"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
async-trait = "0.1"

# Caching
moka = { version = "0.12", features = ["sync", "future"] }
arc-swap = "1.7"

# Database
redb = "2.6"

# Adblocking
# No `single-thread`: makes `adblock::Engine` Send + Sync so one Arc<Engine> is shared by all workers.
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

# HTML/CSS parsing
html5ever = "0.28"
cssparser = "0.31"
selectors = "0.25"
ammonia = "4.0"

# JavaScript engine

# HTTP client (rustls only — default-features=false avoids pulling native-tls/openssl-sys)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "http2", "charset"] }

# Frontend
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"

# Rate limiting
governor = "0.7"

# Public suffix list
publicsuffix = "2.0"

# Input validation
validator = { version = "0.19", features = ["derive"] }

# Shared API DTOs (single source of truth for web-api + web-ui)
api-types = { path = "crates/api-types" }

# Concurrency
dashmap = "6.1"
crossbeam = "0.8"
parking_lot = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.15"
rand = "0.8"
rayon = "1.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Hot byte-crunching dependencies stay optimised in dev/test builds so streaming tests are fast.
[profile.dev.package.lol_html]
opt-level = 3
[profile.dev.package.encoding_rs]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

