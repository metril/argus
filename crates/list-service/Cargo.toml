[package]
name = "list-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
libc = "0.2"
filter-engine = { path = "../filter-engine", default-features = false }
ext-rules = { path = "../ext-rules" }
common = { path = "../common" }
async-compression = { workspace = true, features = ["zstd"] }
tokio-util = { workspace = true }

[features]
default = ["bundled-ubo-resources"]
# Propagates to filter-engine: embed the GPL-3.0 uBO scriptlet snapshot.
bundled-ubo-resources = ["filter-engine/bundled-ubo-resources"]

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
