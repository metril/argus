[build]
target = "index.html"
dist = "dist"
# Disable wasm-opt to avoid compatibility issues with bulk memory operations
# The setting takes effect via "skip_wasm_opt = true" in [[hooks]] or we can
# pass --no-optimize to trunk build (added in Dockerfile)

[watch]
watch = ["src", "style", "index.html"]
ignore = []

[serve]
address = "127.0.0.1"
port = 5173
open = false

# Proxy API requests to backend in development
[[proxy]]
rewrite = "/api/"
backend = "http://localhost:3000/api/"
