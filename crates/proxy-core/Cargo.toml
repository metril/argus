[package]
name = "proxy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "adblocker"
path = "src/main.rs"

[lib]
name = "proxy_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# HTTP
hyper = { workspace = true }
hyper-util = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true }
# Shared pooled upstream client for forwarding proxied requests (TLS-capable, streaming).
reqwest = { workspace = true, features = ["stream"] }
# Streaming response bodies + HTML cosmetic injection.
futures-util = { workspace = true }
async-stream = { workspace = true }
async-compression = { workspace = true, features = ["zstd"] }
brotli = "8"

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
pem = { workspace = true }

# Tower middleware

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
async-trait = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }

# CIDR matching for the destination policy and client ACL
ipnet = "2.9"

adblock = { workspace = true }
arc-swap = { workspace = true }
blake3 = "1.5"
rustc-hash = "2"

# Caching
moka = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Time
time = { workspace = true }

# Encryption (for CA key encryption at rest)
age = { workspace = true }
secrecy = { workspace = true }
rand = "0.8"

# Common utilities
common = { path = "../common" }

# WebSocket proxying (optional, feature `websockets`)
tokio-tungstenite = { workspace = true, optional = true }
webpki-roots = "1.0"

# Filter engine (always on — request filtering is the core of the proxy)
filter-engine = { path = "../filter-engine", default-features = false }
ext-rules = { path = "../ext-rules" }
script-policy = { path = "../script-policy", features = ["store"] }
chrono = { workspace = true }

# Userscript engine (always on: delivery and the GM endpoints are part of the proxy path)
userscript-engine = { path = "../userscript-engine" }

# Web API (optional)
web-api = { path = "../web-api", optional = true }

# Filter-list service (always on — loads, compiles and refreshes the rules)
list-service = { path = "../list-service", default-features = false }

# Streaming HTML rewriting, charset handling, hashing
lol_html = "2"
encoding_rs = "0.8"
sha2 = { workspace = true }
base64 = "0.22"
regex = { workspace = true }
hickory-resolver = "0.26"
tracing-appender = "0.2"

[target.'cfg(unix)'.dependencies]
# getifaddrs: the proxy host's own interface addresses (destination policy).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# SO_ORIGINAL_DST / IP6T_SO_ORIGINAL_DST for transparent mode.
socket2 = { version = "0.6", features = ["all"] }

[features]
# Request filtering is always compiled in; WebSocket proxying is on by default.
default = ["websockets", "bundled-ubo-resources"]
# Embed the uBlock Origin resource library (GPL-3.0) as the offline fallback; see docs/LICENSING.md.
bundled-ubo-resources = ["list-service/bundled-ubo-resources"]
websockets = ["dep:tokio-tungstenite"]
userscripts = []
webui = ["dep:web-api"]
full = ["websockets", "userscripts", "webui", "bundled-ubo-resources"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
proptest = "1.5"

[[bench]]
name = "proxy_bench"
harness = false

[[bench]]
name = "rewrite_bench"
harness = false

[[bench]]
name = "userscripts_bench"
harness = false

[[bench]]
name = "script_policy_bench"
harness = false

[[bench]]
name = "profiles_bench"
harness = false
