[package]
name = "proxy-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "adblocker"
path = "src/main.rs"

[lib]
name = "proxy_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# HTTP
hyper = { workspace = true }
hyper-util = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true }
# Shared pooled upstream client for forwarding proxied requests (TLS-capable, streaming).
reqwest = { workspace = true, features = ["stream"] }
# Streaming response bodies + HTML cosmetic injection.
futures-util = { workspace = true }
async-stream = { workspace = true }
async-compression = { workspace = true }

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
pem = { workspace = true }

# Tower middleware

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
config = { workspace = true }
toml = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
url = { workspace = true }
bytes = { workspace = true }

# Caching
moka = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Time
time = { workspace = true }

# Encryption (for CA key encryption at rest)
age = { workspace = true }
secrecy = { workspace = true }
rand = "0.8"

# Common utilities
common = { path = "../common" }

# WebSocket proxying (optional, feature `websockets`)
tokio-tungstenite = { workspace = true, optional = true }
webpki-roots = "1.0"

# Filter engine (always on — request filtering is the core of the proxy)
filter-engine = { path = "../filter-engine" }

# Userscript engine (optional)
userscript-engine = { path = "../userscript-engine", optional = true }

# Web API (optional)
web-api = { path = "../web-api", optional = true }

# Filter-list service (always on — loads, compiles and refreshes the rules)
list-service = { path = "../list-service" }

[target.'cfg(target_os = "linux")'.dependencies]
# SO_ORIGINAL_DST / IP6T_SO_ORIGINAL_DST for transparent mode.
socket2 = { version = "0.6", features = ["all"] }

[features]
# Request filtering is always compiled in; WebSocket proxying is on by default.
default = ["websockets"]
websockets = ["dep:tokio-tungstenite"]
userscripts = ["dep:userscript-engine"]
webui = ["dep:web-api", "dep:userscript-engine"]
full = ["websockets", "userscripts", "webui"]

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "proxy_bench"
harness = false
