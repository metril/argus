[package]
name = "web-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Authentication
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Rate limiting
governor = { workspace = true }

# Validation
validator = { workspace = true }

# Time
chrono = { workspace = true }

# Database
list-service = { path = "../list-service", default-features = false }
ext-rules = { path = "../ext-rules" }

# HTTP client (shared, for downloading filter lists)
reqwest = { workspace = true }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
dashmap = "5.5"
cookie = { version = "0.18", features = ["percent-encode"] }
parking_lot = { workspace = true }
base64 = "0.22"
url = "2.5"
ipnet = "2.9"

# Common utilities
common = { path = "../common" }
filter-engine = { path = "../filter-engine", default-features = false }
userscript-engine = { path = "../userscript-engine" }
script-policy = { path = "../script-policy", features = ["store"] }
api-types = { workspace = true, features = ["server"] }
async-trait = { workspace = true }
futures-util = { workspace = true }

# OpenAPI documentation
utoipa = { version = "5.3", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
# rust-embed reads assets from disk in debug builds, at the path they had when compiled. That path
# is gone when a prebuilt test archive runs elsewhere, so embed them instead (feature unification
# applies this to every crate using rust-embed, e.g. age and utoipa-swagger-ui).
rust-embed = { version = "8", features = ["debug-embed"] }
utoipa-axum = "0.2"

# Token digests, CSRF tags, ETags
blake3 = "1.5"
# Built-in HTTPS for the web UI
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
arc-swap = { workspace = true }
# CA certificate details
x509-parser = "0.18"
sha2 = "0.10"

[features]
# Fault-injection hooks for integration tests only; never enabled in release builds.
test-hooks = []

[dev-dependencies]
web-api = { path = ".", features = ["test-hooks"] }
axum-test = "18"
minisign = "0.7"
futures-util = { workspace = true }
tempfile = "3.10"
rcgen = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
