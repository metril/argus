[package]
name = "web-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Authentication
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Rate limiting
governor = { workspace = true }

# Validation
validator = { workspace = true }

# Time
chrono = { workspace = true }

# Database
sled = { workspace = true }
list-service = { path = "../list-service" }

# HTTP client (shared, for downloading filter lists)
reqwest = { workspace = true }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
dashmap = "5.5"
cookie = { version = "0.18", features = ["percent-encode"] }
parking_lot = { workspace = true }
base64 = "0.22"
url = "2.5"

# Common utilities
common = { path = "../common" }
filter-engine = { path = "../filter-engine" }
userscript-engine = { path = "../userscript-engine" }
api-types = { workspace = true, features = ["server"] }

# OpenAPI documentation
utoipa = { version = "5.3", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

[dev-dependencies]
axum-test = "18"
tempfile = "3.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
