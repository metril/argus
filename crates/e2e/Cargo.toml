[package]
name = "e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
proxy-core = { path = "../proxy-core", default-features = false, features = ["websockets", "webui"] }
web-api = { path = "../web-api" }
axum-test = "18"
cookie = "0.18"
toml = { workspace = true }
chrono = { workspace = true }
ipnet = { version = "2.9", features = ["serde"] }
filter-engine = { path = "../filter-engine", default-features = false }
ext-rules = { path = "../ext-rules" }
userscript-engine = { path = "../userscript-engine" }
script-policy = { path = "../script-policy", features = ["store"] }
list-service = { path = "../list-service", default-features = false }
common = { path = "../common" }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
async-compression = { workspace = true, features = ["zstd"] }
encoding_rs = "0.8"
serde_json = { workspace = true }
base64 = "0.22"
hdrhistogram = { version = "7", default-features = false }
libc = "0.2"
