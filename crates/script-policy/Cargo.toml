[package]
name = "script-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure NoScript-style script policy: capability model, per-site rules, CSP generation, HTML actions, network hints, block reports"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
psl = "2"
rustc-hash = "2"
url = { workspace = true }
# Only with the `store` feature (redb persistence + generation counter).
common = { path = "../common", optional = true }
parking_lot = { workspace = true, optional = true }
uuid = { version = "1.6", features = ["v4"], optional = true }

[features]
default = []
store = ["dep:common", "dep:parking_lot", "dep:uuid"]

[dev-dependencies]
criterion = { workspace = true }
proptest = "1"
tempfile = { workspace = true }

[[bench]]
name = "decide"
harness = false
