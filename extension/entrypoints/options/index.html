<!doctype html>
<html><head><meta charset="utf-8"><title>Argus options</title>
<style>body{font:14px system-ui;max-width:460px;margin:24px auto;padding:0 16px}label{display:block;margin:12px 0 4px}input{width:100%;padding:6px;box-sizing:border-box}button{margin:12px 8px 0 0;padding:6px 12px}#msg{margin-top:12px}</style>
</head><body>
<h1>Argus</h1>
<label for="url">Argus URL</label><input id="url" placeholder="http://localhost:8080">
<label for="token">API token (scope logs:read)</label><input id="token" type="password">
<button id="save">Save</button><button id="test">Test connection</button>
<h2>Userscripts</h2>
<p>Lets the extension tag pages with a private session header and relay logged-in requests only for scripts you approved.</p>
<div id="msg" role="status"></div>
<script type="module" src="./main.ts"></script>
</body></html>
