# Default configuration for Rust MITM Proxy

[proxy]
host = "0.0.0.0"
port = 8080
enable_http2 = true
enable_http3 = false
enable_websockets = true

[mitm]
enabled = true
ca_cert_path = "certs/root-ca.crt"
ca_key_path = "certs/root-ca.key"
cert_cache_size = 1000
cert_ttl_days = 30
cert_idle_timeout_secs = 3600

[performance]
max_connections = 10000
max_cert_generations = 10
max_html_buffers = 200
connection_timeout_secs = 30
request_timeout_secs = 60

[adblock]
enabled = true
data_dir = "data/filters"
auto_update = true
update_interval_hours = 24
# uBlock Origin scriptlet source directory (GitHub contents API). Fetched once, converted to
# adblock-rust resources, and cached so `##+js(...)` scriptlet rules can inject. May also point to
# a single uBO scriptlets.js (.js) or a pre-built adblock-rust resources array (.json). Set to ""
# to disable scriptlet injection.
scriptlet_resources_url = "https://api.github.com/repos/gorhill/uBlock/contents/src/js/resources"

[webui]
enabled = true
host = "0.0.0.0"
port = 3000
jwt_secret_path = "data/jwt_secret"
session_storage_path = "data/sessions"
cors_origins = ["http://localhost:3000"]
rate_limit_global_rpm = 10000
rate_limit_ip_rpm = 100
rate_limit_user_rpm = 1000
