services:
  argus:
    image: ghcr.io/metril/argus:${ARGUS_VERSION:-${ADBLOCKER_VERSION:-latest}}
    container_name: argus-proxy
    restart: unless-stopped
    # Host networking: transparent mode needs the kernel's original destination, which a bridge
    # network's NAT destroys. The proxy (8080), transparent listener (3129) and web UI (3000) bind
    # directly on the host; change them in the web UI. See docs/TRANSPARENT.md for the gateway's
    # nftables redirect.
    network_mode: host
    volumes:
      # Named volumes (not host bind mounts) so Docker initializes them with the
      # image's argus:argus (UID 1000) ownership — required for the
      # non-root, read-only-rootfs container to write. The CA certificate is
      # downloadable from the Web UI, so host access to ./certs isn't needed.
      - certs:/app/certs
      # Persist filter lists and userscripts
      - data:/app/data
      # Persist logs
      - logs:/app/logs
      # Settings saved from the web UI go to /app/data/settings.toml (this volume); the shipped
      # config is read-only. Optional custom configuration: copy config/default.toml from the repository next to this
      # file, edit it, then uncomment. (The image ships a default; an empty mount would hide it.)
      # - ./config:/app/config:ro
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - WEBUI_DIST_PATH=/app/webui
    # Security hardening: drop all capabilities, forbid privilege escalation,
    # and run with a read-only root filesystem (writes go to the mounted
    # volumes below; transient scratch goes to a tmpfs).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G

volumes:
  certs:
  data:
  logs:
