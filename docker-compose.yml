version: '3.8'

services:
  adblocker:
    build:
      context: .
      dockerfile: Dockerfile
    image: adblocker-proxy:latest
    container_name: adblocker-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP proxy
      - "8443:8443"   # HTTPS proxy
      - "3000:3000"   # Web API + WebUI
    volumes:
      # Persist generated certificates
      - ./certs:/app/certs
      # Persist filter lists and userscripts
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
      # Custom configuration
      - ./config:/app/config:ro
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - WEBUI_DIST_PATH=/app/webui
    networks:
      - adblocker-net
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1G

networks:
  adblocker-net:
    driver: bridge
