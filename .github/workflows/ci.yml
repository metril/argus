name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - name: Product name is capitalized in user-visible text
        run: |
          # Identifiers (realm, server-timing, crate and image names, paths) stay lowercase;
          # only view strings and log/API prose are checked.
          if grep -rnE '>"argus"<|"argus (proxy|server|web)' crates/web-ui/src crates/web-api/src crates/proxy-core/src; then
            echo 'Write "Argus" with a capital A in user-visible text' >&2
            exit 1
          fi

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # Compile once; shards only run the prebuilt test binaries.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      # e2e and e2e-browser run in their own jobs, so exclude them here to avoid running it twice.
      - run: cargo nextest archive --workspace --all-features --exclude e2e --exclude e2e-browser --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
      # count: round-robins the sorted test list, so shards stay evenly sized.
      - run: >
          cargo nextest run
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.shard }}/4

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - run: cargo nextest run -p e2e

  # Real Chromium behind the proxy (CSP, cosmetics, scriptlets, encodings, websockets).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: browser
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - run: cargo nextest run -p e2e-browser --no-fail-fast --no-capture
        env:
          ARGUS_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          ARGUS_REQUIRE_BROWSER: "1"

  # Real SO_ORIGINAL_DST behind an nftables REDIRECT, inside a throwaway network namespace.
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: kernel
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - name: Allow unprivileged user namespaces and install nftables
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2
      - name: Fail instead of skipping when the environment cannot run the test
        run: unshare -rn sh -c 'ip link set lo up && nft list ruleset >/dev/null'
      - run: cargo nextest run -p proxy-core --test kernel_original_dst --no-capture
        env:
          ARGUS_KERNEL_TEST: "1"

  # The real extension in real browsers against a real Argus process (own data dir, ephemeral
  # ports, stub DNS). One shard per browser.
  ext-e2e:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Chromium build for ubuntu 26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ext-e2e
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the extension for tests (per-host permissions a headless browser cannot be asked for)
        working-directory: extension
        run: |
          npm ci
          ARGUS_E2E_HOSTS='*://*.api.test/*,*://*.app.test/*,*://127.0.0.1/*' npx wxt build -b chrome
          npx wxt build -b firefox
      - name: Chromium that honours --load-extension (branded Chrome 137+ removed it)
        if: matrix.browser == 'chromium'
        run: |
          npx --yes playwright@1.56.1 install --with-deps chromium
          echo "ARGUS_EXT_BROWSER=$(ls -d $HOME/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | tail -n1)" >> "$GITHUB_ENV"
      - run: cargo build -p proxy-core --bin argus --features full
      - run: cargo nextest run -p e2e-browser --test extension_${{ matrix.browser }} --no-fail-fast --no-capture
        env:
          ARGUS_EXT_E2E: "1"

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Extension version matches the Cargo workspace version
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' ../Cargo.toml | head -n1)
          ext_version=$(node -p "require('./package.json').version")
          [ "$cargo_version" = "$ext_version" ] || { echo "::error::extension $ext_version != Cargo $cargo_version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npx wxt build -b chrome && npx wxt zip -b chrome
      - run: npx wxt build -b firefox && npx wxt zip -b firefox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-extension
          path: extension/.output/*.zip

  ci-ok:
    if: always()
    needs: [fmt, clippy, build, test, e2e, browser, kernel, extension, ext-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "not all jobs succeeded"; exit 1; }
          done
